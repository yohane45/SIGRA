<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGRA - Inicio de Sesión</title>
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>
<body>
<!-- =====================================-->
<!-- CONTENIDO PRINCIPAL -->
<!-- =====================================-->
    
    <main class="login-page">
        <section class="surface login-card">
            <div class="login-header">
                <img src="../assets/img/logo.png" alt="Logo SIGRA" class="login-logo">
                <h1>SIGRA</h1>
                <p class="system-description">
                    Sistema Integrado de Gestión del Riesgo y Capacitaciones</p>
                    
                <p class="welcome-message">
                    Bienvenido.</p>
                <p class="welcome-text">
                    Ingrese sus credenciales para continuar.</p>
                    
                    <div class="login-icons">
                        <i class="bi bi-shield-lock-fill"></i>
                        <i class="bi bi-heart-pulse-fill"></i>
                        <i class="bi bi-people"></i>
                    </div>    
            </div>
            <!--Usuario-->
            <form action="../index.html" method="get">
                <div class="form-group">
                    <label for="usuario">
                        Usuario
                    </label>
                    <div class="input-group">
                    <i class="bi bi-person"></i>
                    <input type="text" id="usuario" placeholder="Ingrese su usuario">
                    </div>
                </div>
                <!--Campo Rol-->
                <div class="form-group">
                    <label for="rol">
                        Rol
                    </label>
                    <div class="input-group">
                        <i class="bi bi-people"></i>
                        <select id="rol" name="rol">
                            <option value="">Seleccione su rol</option>
                            <option value="Administrador">Administrador</option>
                            <option value="Gerencia">Gerencia</option>
                            <option value="Equipo SST - Coordinador">Equipo SST - Coordinador</option>
                            <option value="Equipo SST - Analista">Equipo SST - Analista</option>
                            <option value="Equipo SST - Auxiliar">Equipo SST - Auxiliar</option>
                            <option value="Recursos Humanos">Recursos Humanos</option>
                            <option value="Trabajador">Trabajador</option>
                        </select>
                    </div>    
                </div> 
                <!--Campo contraseña-->
                <div class="form-group">
                    <label for="password">
                        Contraseña
                    </label>
                    <div class="input-group">
                    <i class="bi bi-lock"></i>
                    <input type="password" id="password" placeholder="Ingrese su contraseña">
                    </div>
                </div>
                
                <button type="submit" class="button-primary">
                    <i class="bi bi-box-arrow-in-right"></i>
                    Iniciar Sesión
                </button>
                <a href="#" class="forgot-password">
                    ¿Olvidaste tu contraseña?
                </a>
            </form>
        </section>
    </main>
    
    <script src="../assets/js/login.js"></script>

</body>
</html>
